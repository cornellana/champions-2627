name: Champions
options:
  bundleIdPrefix: com.cornellana
  deploymentTarget:
    iOS: "17.0"
  # El idioma de desarrollo es el inglés porque las claves del catálogo están en
  # inglés; castellano y catalán son traducciones a partir de ahí.
  knownRegions: [en, es, ca]
  developmentLanguage: en

targets:
  Champions:
    type: application
    platform: iOS
    sources:
      - path: Champions
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Champions
        # En iPhone solo vertical: la app es una lista larga y en horizontal no
        # gana nada. En iPad hay que admitirlas todas o declarar pantalla
        # completa, porque si no la multitarea del sistema no funciona — y sale
        # como aviso al archivar, que es de las cosas que pueden costar un
        # rechazo en revisión.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        # La app solo habla HTTPS estándar con ESPN, GitHub y el NAS: no lleva
        # criptografía propia, así que está exenta. Declararlo aquí evita que
        # TestFlight pregunte por el cumplimiento de exportación en cada build.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: 7
        MARKETING_VERSION: 1.0
        DEVELOPMENT_TEAM: TJ6V4QM3GB
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: Champions/Champions.entitlements
      properties:
        # Los avisos en vivo (gol, roja, principio y final) llegan por APNs
        # desde el NAS. En depuración el entorno es `development`; al archivar
        # para TestFlight, Xcode lo cambia solo a `production`.
        aps-environment: development
