name: Champions
options:
  bundleIdPrefix: com.cornellana
  deploymentTarget:
    iOS: "17.0"
  # El idioma de desarrollo es el inglés porque las claves del catálogo están en
  # inglés; castellano y catalán son traducciones a partir de ahí.
  knownRegions: [en, es, ca]
  developmentLanguage: en

targets:
  Champions:
    type: application
    platform: iOS
    sources:
      - path: Champions
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Champions
        # Solo vertical: la app es una lista larga y en horizontal no gana nada.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        DEVELOPMENT_TEAM: TJ6V4QM3GB
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: Champions/Champions.entitlements
      properties:
        # Los avisos en vivo (gol, roja, principio y final) llegan por APNs
        # desde el NAS. En depuración el entorno es `development`; al archivar
        # para TestFlight, Xcode lo cambia solo a `production`.
        aps-environment: development
